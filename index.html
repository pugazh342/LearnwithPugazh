      .btn-sm { padding: 0.6rem 1.3rem; font-size: 0.84rem; }
      .section { padding: 6.5rem 0; position: relative; }

      .navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(251,247,242,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid transparent; transition: border-color 0.2s; }
      .navbar.is-scrolled { border-bottom-color: var(--border); }
      .navbar-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }
      .brand { font-size: 1.3rem; font-weight: 700; }
      .hero { position: relative; padding-top: 8.5rem; overflow: hidden; }
      .hero-inner { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 3rem; align-items: center; padding-bottom: 4rem; }
      .hero-eyebrow { display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.82rem; font-weight: 600; color: var(--accent-dark); background: var(--accent-soft); padding: 0.5rem 1rem; border-radius: 999px; margin-bottom: 1.6rem; }
      .hero-title { font-size: clamp(2.1rem, 4vw, 3.1rem); font-weight: 600; line-height: 1.28; color: var(--text-primary); margin-bottom: 1.4rem; }
      .hero-tagline { color: var(--text-secondary); font-size: 1.08rem; line-height: 1.8; max-width: 540px; margin-bottom: 2.2rem; }
      .hero-actions { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 2.4rem; }
      .hero-socials { display: flex; gap: 0.8rem; }
      .social-pill { width: 42px; height: 42px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid var(--border); color: var(--text-secondary); transition: all 0.2s ease; }
      .hero-visual { position: relative; display: flex; align-items: center; justify-content: center; height: 440px; }
      .blob { position: absolute; width: 340px; height: 340px; background: var(--gradient-brand); border-radius: 62% 38% 55% 45% / 48% 52% 48% 52%; opacity: 0.9; }
      .hero-photo { position: relative; width: 280px; height: 280px; border-radius: 50%; background: var(--surface); border: 6px solid var(--bg); box-shadow: var(--shadow-soft); overflow: hidden; }
      .hero-photo-img { width: 100%; height: 100%; object-fit: cover; }
      .hero-stats-bar { border-top: 1px solid var(--border); background: var(--surface-soft); }
      .hero-stats-row { display: flex; justify-content: space-between; padding: 2rem 1.5rem; flex-wrap: wrap; gap: 1.5rem; }
      .hero-stat { display: flex; flex-direction: column; align-items: flex-start; }
      .hero-stat-value { font-size: 1.9rem; font-weight: 700; color: var(--accent); }
      .hero-stat-label { font-size: 0.84rem; color: var(--text-muted); margin-top: 0.2rem; }
      @media (max-width: 960px) {
        .hero-inner { grid-template-columns: 1fr; }
        .hero-visual { order: -1; height: 320px; margin-bottom: 1rem; }
        .blob { width: 250px; height: 250px; }
        .hero-photo { width: 210px; height: 210px; }
